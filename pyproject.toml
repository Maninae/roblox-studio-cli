[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "roblox-studio-cli"
dynamic = ["version"]
description = "CLI over Roblox Studio's built-in MCP server, for agents and humans"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Owen Wang" }
]
keywords = ["roblox", "studio", "mcp", "cli", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.9.0,<1.0",
]

# Pinned exactly: the test extra decides what runs in CI, and a linter that
# gains a rule overnight (or a test runner that changes a default) should be a
# deliberate bump in a commit, never a surprise on an unrelated pull request.
[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[project.scripts]
roblox-studio = "roblox_studio_cli.main:main"

# One source of truth for the version: src/roblox_studio_cli/__init__.py.
# client.CLIENT_VERSION reads the same value, so the string Studio sees in the
# MCP handshake cannot drift from the packaged one.
[tool.hatch.version]
path = "src/roblox_studio_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/roblox_studio_cli"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
