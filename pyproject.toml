[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roblox-studio-cli"
version = "0.1.0"
description = "CLI over Roblox Studio's built-in MCP server, for agents and humans"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Owen Wang" }
]
keywords = ["roblox", "studio", "mcp", "cli", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.9.0,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.scripts]
roblox-studio = "roblox_studio_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/roblox_studio_cli"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
